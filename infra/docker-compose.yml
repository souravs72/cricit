# Local development. Start with `make up` from the repo root.
# Postgres and Redis bind to localhost only.
name: cricit

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cricit
      POSTGRES_PASSWORD: cricit
      POSTGRES_DB: cricit
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricit"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ../backend
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://cricit:cricit@postgres:5432/cricit
      REDIS_URL: redis://redis:6379/0
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: [../backend/app:/app/app, ../backend/alembic:/app/alembic]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ../backend
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://cricit:cricit@postgres:5432/cricit
      REDIS_URL: redis://redis:6379/0
    command: ["arq", "app.workers.main.WorkerSettings", "--watch", "app"]
    volumes: [../backend/app:/app/app]
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  redisdata:
