# Oracle Cloud Always Free (Ampere ARM). Builds on the VM. No GHCR.
# From /opt/cricit:
#   docker compose --env-file /opt/cricit/.env -f infra/docker-compose.oci.yml up -d --build
name: cricit

x-backend: &backend
  build: ../backend
  env_file: [../.env]
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      CRICIT_API_HOST: ${CRICIT_API_HOST}
      CRICIT_ADMIN_HOST: ${CRICIT_ADMIN_HOST}
      CRICIT_TLS_EMAIL: ${CRICIT_TLS_EMAIL}
    volumes:
      - ./Caddyfile.oci:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    restart: unless-stopped
    depends_on: [api, admin]

  migrate:
    <<: *backend
    restart: "no"
    read_only: false
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s

  worker:
    <<: *backend
    command: ["arq", "app.workers.main.WorkerSettings"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  admin:
    build: ../admin
    env_file: [../.env]
    environment:
      API_BASE_URL: http://api:8000
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

volumes:
  pgdata:
  redisdata:
  caddydata:
