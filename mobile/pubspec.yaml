name: cricit
description: CRICIT — cricket news in one-minute cards.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.0.0
  go_router: ^14.6.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  shared_preferences: ^2.3.3
  # Fonts are bundled under fonts/ so first paint works on patchy data.
  # Later tickets:
  # firebase_core / firebase_auth / firebase_messaging / firebase_app_check  (T22, T34)
  # drift + sqlite3_flutter_libs  (T27 — JSON cache ships now)
  # youtube_player_iframe  (T29)
  # google_mobile_ads  (T32)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
    - family: SourceSans3
      fonts:
        - asset: fonts/SourceSans3-Regular.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: fonts/NotoSansDevanagari.ttf
