include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    missing_return: error
    unused_import: error
  exclude:
    # Generated by `flutter gen-l10n` (unused: the app reads copy from
    # lib/l10n/l10n.dart). The SDK's generator still emits the pre-3.47
    # localizations delegates, so it can't be edited to pass.
    - lib/l10n/app_localizations*.dart
    - build/**
    - android/**
    - ios/**
    - web/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_final_locals
    - require_trailing_commas
    - unawaited_futures
