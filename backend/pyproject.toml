[project]
name = "cricit-backend"
version = "0.1.0"
description = "CRICIT API and background workers"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "gunicorn>=23",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "arq>=0.26",
  "httpx>=0.28",
  "structlog>=24.4",
  "pyjwt[crypto]>=2.10",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "firebase-admin>=6.6",
  "feedparser>=6.0",
  "trafilatura>=2.0",
  "selectolax>=0.3",
  "rapidfuzz>=3.10",
  "uuid-utils>=0.9",
  "sentry-sdk[fastapi]>=2.19",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"scripts/**" = ["S105", "S106", "E501", "RUF001"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "alembic.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs Postgres and Redis"]
