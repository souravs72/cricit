# main → staging automatically; production only by manual approval (GitHub environment "production").
name: deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
    inputs:
      target: { description: "staging or production", required: true, default: "staging" }

concurrency: { group: deploy-${{ github.event.inputs.target || 'staging' }}, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'staging' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ github.event.inputs.target || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: API — migrate then deploy
        working-directory: api
        run: |
          npm ci
          npm run db:migrate:$TARGET
          npm run deploy:$TARGET
      - name: Admin — build and deploy
        working-directory: admin
        run: |
          npm ci
          npm run deploy:$TARGET
