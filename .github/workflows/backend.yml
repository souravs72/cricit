name: backend
on:
  push: { branches: [main] }
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: cricit, POSTGRES_PASSWORD: cricit, POSTGRES_DB: cricit }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cricit" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://cricit:cricit@localhost:5432/cricit
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - name: Migrations apply cleanly and match the models
        run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest --cov=app --cov-report=term-missing
      - name: Dependency audit
        run: uvx pip-audit --strict -r <(uv export --frozen --no-dev --no-hashes)
        shell: bash
